# Disposable local/remote test instance (PLAN.md §2 data isolation).
#
# The database lives on tmpfs and is destroyed with the container: test reset
# means replacing the whole disposable database, never deleting rows from a
# shared one. This stack must never point at the production volume.
#
#   docker compose -f docker-compose.test.yml up --build
#   docker/smoke.sh http://127.0.0.1:8080
#   docker compose -f docker-compose.test.yml down

name: basefit-test

services:
  basefit:
    build:
      context: .
    image: basefit:test
    ports:
      - "127.0.0.1:${BASEFIT_TEST_PORT:-8080}:8000"
    environment:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:${BASEFIT_TEST_PORT:-8080}
      COOKIE_SECURE: "false"
      SESSION_TTL_SECONDS: "86400"
      DATABASE_PATH: /data/basefit-test.db
      STATIC_DIR: /app/static
    tmpfs:
      # Writable by the non-root runtime user (uid 10001); destroyed with
      # the container.
      - /data:rw,noexec,nosuid,mode=01777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
