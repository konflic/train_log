name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install dependencies
        run: pip install -c constraints.txt -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Typecheck
        run: mypy app migrate.py
      - name: Tests
        run: pytest -q
      - name: Migration and backup check (isolated temporary database)
        run: |
          export DATABASE_PATH="$RUNNER_TEMP/basefit-migrations.db"
          python migrate.py
          python migrate.py
          python -m app.backup backup "$DATABASE_PATH" "$RUNNER_TEMP/basefit-backup.db"
          python -m app.backup verify "$RUNNER_TEMP/basefit-backup.db"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/
      - name: Svelte/TS check
        run: npm run check
      - name: Lint and format check
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install backend
        run: python -m pip install -c backend/constraints.txt ./backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E smoke tests
        run: npm run test:e2e
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build single-origin image
        run: docker build -t basefit:ci .
      - name: Run container against a disposable database
        run: |
          docker run -d --rm --name basefit-ci -p 127.0.0.1:8080:8000 \
            -e APP_ENV=test \
            -e APP_ORIGIN=http://127.0.0.1:8080 \
            -e COOKIE_SECURE=false \
            -e DATABASE_PATH=/data/basefit.db \
            -e STATIC_DIR=/app/static \
            basefit:ci
      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs basefit-ci
          exit 1
      - name: Deployment smoke through the public API
        run: ./docker/smoke.sh http://127.0.0.1:8080
      - name: Production build contains no e2e-only hook
        run: |
          docker create --name basefit-inspect basefit:ci
          docker cp basefit-inspect:/app/static /tmp/static
          docker rm basefit-inspect
          ! grep -r '__basefitApi' /tmp/static
      - name: Stop container
        if: always()
        run: docker stop basefit-ci || true
